name: ai-ops-gateway-atr-lab

x-gateway-environment: &gateway-environment
  APP_ENV: development
  API_KEY: ${ATR_LAB_API_KEY:-atr-lab-admin}
  API_KEYS_JSON: '{"atr-lab-admin":{"subject":"lab-admin","tenant_id":"atr-lab","role":"admin"},"engineer-a-key":{"subject":"engineer-a","tenant_id":"atr-lab","role":"operator"},"security-reviewer-key":{"subject":"security-reviewer","tenant_id":"atr-lab","role":"operator"},"operations-reviewer-key":{"subject":"operations-reviewer","tenant_id":"atr-lab","role":"operator"},"wallet-approver-key":{"subject":"wallet-approver","tenant_id":"atr-lab","role":"operator"},"corpus-reviewer-a-key":{"subject":"corpus-reviewer-a","tenant_id":"atr-lab","role":"operator"},"corpus-reviewer-b-key":{"subject":"corpus-reviewer-b","tenant_id":"atr-lab","role":"operator"}}'
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway
  LLM_BASE_URL: http://mock-model:8080/v1
  LLM_API_KEY: local-only
  LLM_MODEL: mock-model
  LLM_ROUTES_JSON: '{"ollama-lab":{"base_url":"http://ollama:11434/v1","model":"qwen2.5:0.5b-instruct","api_key":"local-only"}}'
  ATR_LAB_MODE: "true"
  ATR_LAB_FIXTURE_URL: http://fixture-content:8020
  ATR_LAB_DEPLOYMENT_URL: http://deployment-simulator:8030
  ATR_LAB_ARTIFACT_URL: http://artifact-registry:8040
  ATR_LAB_SIGNING_URL: http://signing-simulator:8050
  ATR_LAB_COMPOUND_URL: http://compound-runner:8060
  ATR_LAB_FAILURE_PROXY_URL: http://failure-proxy:8070
  ATR_LAB_INTERNAL_TOKEN: ${ATR_LAB_INTERNAL_TOKEN:-development-only-change-me}
  ATR_LAB_ARTIFACTS_DIR: /var/lib/atr-lab/artifacts
  ATR_ENABLED: "true"
  ATR_BLOCKING: "false"
  ATR_CALIBRATION_MIN_REVIEWS: "2"
  ATR_PROMOTION_MIN_REVIEWERS: "2"
  ATR_PROMOTION_MIN_KAPPA: "0.8"
  ATR_JSONL_PATH: /var/log/ai-gateway/atr-siem.jsonl

services:
  gateway:
    image: ai-ops-gateway-atr-lab:local
    build:
      context: .
      args: {INSTALL_BROWSER: "false"}
    environment: *gateway-environment
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      fixture-content: {condition: service_healthy}
      deployment-simulator: {condition: service_healthy}
      artifact-registry: {condition: service_healthy}
      signing-simulator: {condition: service_healthy}
      compound-runner: {condition: service_healthy}
      failure-proxy: {condition: service_healthy}
      mock-model: {condition: service_healthy}
      siem-init: {condition: service_completed_successfully}
    volumes:
      - siem-data:/var/log/ai-gateway
      - ${ATR_LAB_ARTIFACTS_DIR:-./artifacts/atr-lab}:/var/lib/atr-lab/artifacts:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [lab]

  dashboard:
    image: ai-ops-gateway-atr-dashboard:local
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports: ["3000:8080"]
    depends_on:
      gateway: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=0700
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    networks: [lab]

  fixture-content:
    image: ai-ops-gateway-atr-lab:local
    command:
      ["uvicorn", "app.lab_services.fixture_content:app", "--host", "0.0.0.0", "--port", "8020"]
    environment:
      ATR_LAB_INTERNAL_TOKEN: ${ATR_LAB_INTERNAL_TOKEN:-development-only-change-me}
    expose: ["8020"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/healthz', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [lab]

  deployment-simulator:
    image: ai-ops-gateway-atr-lab:local
    command:
      ["uvicorn", "app.lab_services.deployment_simulator:app", "--host", "0.0.0.0", "--port", "8030"]
    environment:
      ATR_LAB_INTERNAL_TOKEN: ${ATR_LAB_INTERNAL_TOKEN:-development-only-change-me}
      ATR_LAB_DEPLOYMENT_DB: /data/deployments.sqlite3
    expose: ["8030"]
    ports: ["127.0.0.1:8030:8030"]
    depends_on:
      deployment-init: {condition: service_completed_successfully}
    volumes: [deployment-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/healthz', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [lab]

  deployment-init:
    image: alpine:3.22
    command: ["sh", "-ec", "chown 10001:10001 /data && chmod 0750 /data"]
    volumes: [deployment-data:/data]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    read_only: true
    networks: [lab]

  identity-broker:
    image: ai-ops-gateway-atr-lab:local
    command: ["uvicorn", "app.lab_services.identity_broker:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      ATR_LAB_INTERNAL_TOKEN: ${ATR_LAB_INTERNAL_TOKEN:-development-only-change-me}
      ATR_LAB_IDENTITY_DB: /data/identity.sqlite3
    expose: ["8010"]
    depends_on: {compound-data-init: {condition: service_completed_successfully}}
    volumes: [identity-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [lab]

  artifact-registry:
    image: ai-ops-gateway-atr-lab:local
    command: ["uvicorn", "app.lab_services.artifact_registry:app", "--host", "0.0.0.0", "--port", "8040"]
    environment:
      ATR_LAB_INTERNAL_TOKEN: ${ATR_LAB_INTERNAL_TOKEN:-development-only-change-me}
    expose: ["8040"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8040/healthz', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [lab]

  signing-simulator:
    image: ai-ops-gateway-atr-lab:local
    command: ["uvicorn", "app.lab_services.signing_simulator:app", "--host", "0.0.0.0", "--port", "8050"]
    environment:
      ATR_LAB_INTERNAL_TOKEN: ${ATR_LAB_INTERNAL_TOKEN:-development-only-change-me}
      ATR_LAB_SIGNING_DB: /data/signing.sqlite3
    expose: ["8050"]
    ports: ["127.0.0.1:8050:8050"]
    depends_on: {compound-data-init: {condition: service_completed_successfully}}
    volumes: [signing-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/healthz', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [lab]

  compound-runner:
    image: ai-ops-gateway-atr-lab:local
    command: ["uvicorn", "app.lab_services.compound_runner:app", "--host", "0.0.0.0", "--port", "8060"]
    environment:
      ATR_LAB_INTERNAL_TOKEN: ${ATR_LAB_INTERNAL_TOKEN:-development-only-change-me}
      ATR_LAB_COMPOUND_DB: /data/compound.sqlite3
      ATR_LAB_DEPLOYMENT_URL: http://failure-proxy:8070/proxy/deployment
      ATR_LAB_SIGNING_URL: http://failure-proxy:8070/proxy/signing
    expose: ["8060"]
    depends_on:
      compound-data-init: {condition: service_completed_successfully}
      identity-broker: {condition: service_healthy}
      artifact-registry: {condition: service_healthy}
      deployment-simulator: {condition: service_healthy}
      signing-simulator: {condition: service_healthy}
      failure-proxy: {condition: service_healthy}
    volumes: [compound-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8060/healthz', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [lab]

  failure-proxy:
    image: ai-ops-gateway-atr-lab:local
    command: ["uvicorn", "app.lab_services.failure_proxy:app", "--host", "0.0.0.0", "--port", "8070"]
    environment:
      ATR_LAB_INTERNAL_TOKEN: ${ATR_LAB_INTERNAL_TOKEN:-development-only-change-me}
      ATR_LAB_PROXY_DEPLOYMENT_UPSTREAM: http://deployment-simulator:8030
      ATR_LAB_PROXY_SIGNING_UPSTREAM: http://signing-simulator:8050
    expose: ["8070"]
    ports: ["127.0.0.1:8070:8070"]
    depends_on:
      deployment-simulator: {condition: service_healthy}
      signing-simulator: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/healthz', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [lab]

  compound-data-init:
    image: alpine:3.22
    command: ["sh", "-ec", "chown 10001:10001 /compound /identity /signing && chmod 0750 /compound /identity /signing"]
    volumes:
      - compound-data:/compound
      - identity-data:/identity
      - signing-data:/signing
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    read_only: true
    networks: [lab]

  mock-model:
    build: {context: tests/docker/mock-llm}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [lab]

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [lab]

  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: gateway, POSTGRES_PASSWORD: gateway, POSTGRES_DB: gateway}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [lab]

  migrate:
    image: ai-ops-gateway-atr-lab:local
    build:
      context: .
      args: {INSTALL_BROWSER: "false"}
    command: ["python", "-m", "app.db.migrate"]
    environment:
      DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [lab]

  siem-init:
    image: alpine:3.22
    command: ["sh", "-ec", "chown 10001:10001 /siem && chmod 0750 /siem"]
    volumes: [siem-data:/siem]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    read_only: true
    networks: [lab]

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.12.3
    volumes: [ollama-data:/root/.ollama]
    expose: ["11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [lab]

  ollama-init:
    profiles: ["ollama"]
    image: curlimages/curl:8.16.0
    depends_on:
      ollama: {condition: service_healthy}
    environment: {OLLAMA_MODEL: "qwen2.5:0.5b-instruct"}
    command:
      - /bin/sh
      - -ec
      - >-
        curl -fsS http://ollama:11434/api/pull
        -d "{\"name\":\"$${OLLAMA_MODEL}\",\"stream\":false}"
    networks: [lab]

volumes:
  compound-data:
  deployment-data:
  identity-data:
  ollama-data:
  postgres-data:
  redis-data:
  signing-data:
  siem-data:

networks:
  lab: {driver: bridge}
